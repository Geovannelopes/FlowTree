# Servidor do front (build estático do Vite) + proxy do backend na mesma origem.
# Tudo o que o FlowTree expõe sai por esta única URL (porta 9050 no host):
#   /            → SPA Vue
#   /api, /docs  → Laravel
#   /storage     → uploads (disco público)
#   /app         → WebSocket do Reverb
# Basta apontar o proxy/domínio externo para esta porta.

# Protocolo original da requisição: preserva o que veio do proxy/Cloudflare
# (https) e cai no esquema local quando não há cabeçalho.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    ~.      $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (anexos, avatares, logos) passam por /api.
    client_max_body_size 50m;

    # DNS interno do Docker + upstream em variável: a resolução acontece por
    # requisição, então o nginx sobe mesmo se o container `api` ainda não estiver
    # de pé (com o host fixo, ele falharia no start).
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream http://api:80;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend Laravel — mesma origem que o front, então sem CORS.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # Uploads servidos pelo disco público do Laravel (storage:link).
    location /storage/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # Documentação Swagger do Laravel (/docs e /docs/api.yaml).
    location ^~ /docs {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # WebSocket do Reverb (ws://host:9050/app/{key}) → api → Reverb :6100.
    location ^~ /app {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets com hash no nome: imutáveis, cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Shell do app nunca em cache: é o que faz o deploy novo ser visto na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: rotas do vue-router caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
