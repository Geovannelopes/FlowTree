<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FlowTree</title>
    <meta name="description" content="FlowTree — kanban com sprints, métricas e tempo real." />
    <meta name="theme-color" content="#eef2ea" />
    <script>
      // Aplica o tema antes do primeiro paint para evitar flash (FOUC).
      (function () {
        try {
          var t = localStorage.getItem('flowtree_theme')
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'dark' ? '#141a16' : '#eef2ea')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
