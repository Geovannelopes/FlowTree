[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:cron]
command=/usr/sbin/cron -f
autostart=true
autorestart=true
stderr_logfile=/var/www/html/storage/logs/cron.err.log
stdout_logfile=/var/www/html/storage/logs/cron.out.log

; Fila padrão (Redis): notificações e jobs em geral.
[program:queue-default]
command=php /var/www/html/artisan queue:work --queue=default --sleep=3 --tries=3 --backoff=10 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/www/html/storage/logs/worker.out.log
stderr_logfile=/var/www/html/storage/logs/worker.err.log
stopwaitsecs=3600

; Reverb (WebSocket). Bind em 0.0.0.0 na porta 6100: o nginx do container faz o
; proxy de /app para cá, e o PHP publica em 127.0.0.1:6100.
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=6100
directory=/var/www/html
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/www/html/storage/logs/reverb.out.log
stderr_logfile=/var/www/html/storage/logs/reverb.err.log
stopwaitsecs=30

; Permite `supervisorctl status` dentro do container.
[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
